# =============================================================================
# Documentation style
# =============================================================================
# - Professional, direct tone (no marketing language)
# - Tables for CLI options, config fields, scenario/contract fields
# - Code blocks with language hints (bash, yaml, ts)
# - Admonitions sparingly (important notes / warnings only)
# - Examples should be copy-pasteable
# - One topic per page; keep pages focused
# =============================================================================

[project]

site_name = "Pharos"
site_description = "A black-box functional test suite for validating a new service against a legacy one during migration"
site_author = "Pharos Contributors"
site_url = "https://charliek.github.io/pharos/"

repo_name = "charliek/pharos"
repo_url = "https://github.com/charliek/pharos"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site-build"

dev_addr = "127.0.0.1:7072"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Guides" = [
    { "Writing Scenarios" = "guides/scenarios.md" },
    { "Comparison & Contracts" = "guides/comparison-and-contracts.md" },
    { "Variables & Hooks" = "guides/variables-and-hooks.md" },
    { "Recording & Replay" = "guides/recording-and-replay.md" },
    { "Reporting & CI" = "guides/reporting-and-ci.md" },
  ] },
  { "Reference" = [
    { "Architecture" = "reference/architecture.md" },
    { "CLI" = "reference/cli.md" },
    { "Scenario Format" = "reference/scenario-reference.md" },
    { "Contract" = "reference/contract-reference.md" },
    { "Configuration" = "reference/configuration.md" },
  ] },
  { "Development" = [
    { "Setup" = "development/setup.md" },
    { "Testing" = "development/testing.md" },
  ] },
  { "Specifications" = [
    { "Pharos Spec" = "pharos_spec.md" },
    { "Migration Runbook" = "runbook.md" },
    { "PR/FAQ" = "prfaq.md" },
    { "Limen Spec" = "limen_spec.md" },
  ] },
]

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
# The shared StrideLabs theme (stridelabs-docs-theme, pinned in pyproject.toml)
# supplies the palette, the self-hosted type stack, the feature toggles, and
# the owl + project-icon header lockup. Anything set here overrides it.
#
# Do NOT add a [project.theme.font] table: the theme sets `font: false` and
# ships its own woff2 faces, so setting one re-enables Zensical's Google Fonts
# <link> on every page while the self-hosted faces keep loading anyway.
[project.theme]
name = "stridelabs"

# The icon that says *which* tool this is -- rendered beside the shared owl.
[project.theme.icon]
logo = "material/lighthouse"

# -----------------------------------------------------------------------------
# Extra
# -----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/charliek/pharos"

# -----------------------------------------------------------------------------
# Markdown extensions
# -----------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.toc]
permalink = true
