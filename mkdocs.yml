# =============================================================================
# Documentation style
# =============================================================================
# - Professional, direct tone (no marketing language)
# - Tables for CLI options, config fields, scenario/contract fields
# - Code blocks with language hints (bash, yaml, ts)
# - Admonitions sparingly (important notes / warnings only)
# - Examples should be copy-pasteable
# - One topic per page; keep pages focused
# =============================================================================

site_name: Pharos
site_description: 'A black-box functional test suite for validating a new service against a legacy one during migration'
site_author: 'Pharos Contributors'
site_url: 'https://charliek.github.io/pharos/'

repo_name: charliek/pharos
repo_url: https://github.com/charliek/pharos
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site-build

dev_addr: '127.0.0.1:7072'

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/lighthouse

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# The nav grows phase by phase so the published site never references a page
# that does not exist yet. Guides and detailed references are added in the phase
# that implements the feature they describe (spec Section 14).
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Specifications:
      - Pharos Spec: pharos_spec.md
      - Migration Runbook: runbook.md
      - PR/FAQ: prfaq.md
      - Limen Spec: limen_spec.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/charliek/pharos
