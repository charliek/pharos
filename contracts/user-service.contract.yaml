# Behavioral contract for the example user-service migration.
#
# Portable, unchanged, to Limen: it owns *what to compare and how* — never
# operational concerns. Every normalization rule is a deliberate exception to the
# default posture of "compare everything".
version: 1
service: user-service
description: >
  Example behavioral contract refined by Pharos and consumed by Limen. The
  user-service emits per-request metadata (request/trace ids, a "now" timestamp)
  that is incidental and must not count as a difference.

defaults:
  compare_status: true
  compare_body: true
  compare_headers: []
  json:
    ignore_paths:
      - "$.metadata.requestId" # per-request, non-deterministic
      - "$.metadata.generatedAt" # server "now" timestamp
    redact_paths:
      - "$.email" # PII — never appears in a diff, report, or artifact
    normalize_timestamps:
      - path: "$.createdAt"
        precision: seconds # tolerate millis-vs-seconds formatting drift
    enum_aliases:
      - path: "$.status"
        aliases: { ACTIVE: enabled, INACTIVE: disabled }

routes:
  - id: get-user
    match:
      methods: ["GET"]
      path_template: "/users/{id}"
    expectations:
      typical_status: 200
    tags: [read, migration-ready]

  - id: list-users
    match:
      methods: ["GET"]
      path_template: "/users"
    comparison:
      json:
        sort_arrays:
          - path: "$.items"
            key: "id" # order is incidental; sort by stable id
        normalize_timestamps:
          - path: "$.items[*].createdAt"
            precision: seconds
        redact_paths:
          - "$.items[*].email"
    tags: [read, migration-ready]

  - id: create-user
    match:
      methods: ["POST"]
      path_template: "/users"
    comparison:
      json:
        ignore_paths:
          - "$.id" # server-generated; the scenario does not pin it
    expectations:
      typical_status: 201
    tags: [write, migration-ready]

  - id: login
    match:
      methods: ["POST"]
      path_template: "/login"
    comparison:
      set_cookie:
        # Each instance mints its own session id, so the cookie value is never
        # the same across legacy/new by design — compare presence only. The
        # `SameSite` attribute is a deliberate cosmetic difference between the
        # two instances, so it is the one attribute this route ignores.
        compare_values: presence
        ignore_attributes: [SameSite]
    expectations:
      typical_status: 200
    tags: [write, auth, migration-ready]

  - id: find-user-redirect
    match:
      methods: ["GET"]
      path_template: "/users/find"
    comparison:
      location:
        # The redirect Location is relative, resolved against each target's own
        # base URL (spec Section 8.6) — legacy and new run on different origins
        # (different ports in the example), so only the path is meaningful.
        origin: ignore
    expectations:
      typical_status: 303
    tags: [read, migration-ready]
