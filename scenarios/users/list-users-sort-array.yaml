version: 1
id: users.list-users-sort-array
name: List users with array sorting and ignored dynamic fields
description: >
  The list endpoint is compared with the array sorted by a stable key, item
  timestamps normalized, and item emails redacted — so incidental ordering and
  PII never cause a false mismatch.
service: user-service
tags: [read, smoke, migration-ready]
mode: compare_live
contract: "../../contracts/user-service.contract.yaml#list-users"
steps:
  - id: list
    request:
      method: GET
      path: /users
    compare:
      strategy: json_semantic
      status: same
