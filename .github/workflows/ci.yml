name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.13'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # Single required status check the branch ruleset can gate on. Keeping it a
  # separate aggregator job means the required check name stays stable even if
  # build-test later fans out into a matrix.
  ci-success:
    needs: [build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require build-test to have passed
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "::error::build-test concluded '${{ needs.build-test.result }}'"
            exit 1
          fi
